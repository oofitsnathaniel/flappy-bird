<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Flappy Bird - Safari Smooth Test</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #4ec0ca; overscroll-behavior: none; }
body { font: 15px system-ui, sans-serif; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; -webkit-tap-highlight-color: transparent; }
button { padding: 7px 12px; border-radius: 5px; color: white; background: #25251c; border: 1px solid #fff8; cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 2px solid white; outline-offset: 2px; }
#fullscreen { position: absolute; right: 12px; bottom: 12px; }
#display-settings { position: absolute; left: 12px; bottom: 12px; display: flex; align-items: center; gap: 8px; padding: 7px 9px; border: 1px solid #fff8; border-radius: 6px; background: #25251c; color: white; font: 13px system-ui, sans-serif; }
#display-mode { color: white; background: #34342a; border: 1px solid #fff8; border-radius: 4px; padding: 4px 6px; font: inherit; cursor: pointer; }
#display-mode option { background: #25251c; }
@media (max-width: 520px) { #display-settings { left: 6px; bottom: 6px; padding: 5px; font-size: 11px; gap: 4px; } #fullscreen { right: 6px; bottom: 6px; font-size: 11px; padding: 6px; } }
#performance-settings { position:absolute; right:12px; top:12px; z-index:3; display:flex; flex-wrap:wrap; align-items:center; gap:7px; color:#fff; padding:7px 9px; font:12px system-ui,sans-serif; border:1px solid #ffffff77; border-radius:6px; background:#25251ce8; }
#performance-settings select { color:#fff; background:#34342a; border:1px solid #ffffff77; border-radius:4px; padding:3px 5px; }
#metrics { position:absolute;left:12px;top:12px;z-index:4;color:#d9ffe9;background:#122029e8;border:1px solid #98dec277;border-radius:7px;padding:10px 12px; min-width:210px;white-space:pre; font:12px/1.5 ui-monospace,monospace;pointer-events:none; }
#pause-badge { position:absolute;inset:0;z-index:2;display:grid;place-content:center;text-align:center;color:white;text-shadow:2px 2px #172c35;pointer-events:none;font:bold 30px system-ui,sans-serif;background:#0e253342; }
#pause-badge small {font-size:13px;font-weight:normal;}
[hidden] { display:none!important; }
@media (max-width:520px) { #performance-settings {top:6px;right:6px;font-size:10px;padding:5px;} #metrics{left:6px;top:6px;font-size:10px;} }

/* Pixel-art game shell — deliberately flat, chunky, and arcade-like. */
#game-menu,#settings-panel,#stats-panel {
 position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;
 background:rgba(15,35,40,.24);color:#6a5138;
 font-family:"Trebuchet MS","Verdana",sans-serif;font-weight:bold;
 image-rendering:pixelated;
}
.menu-card {
 width:min(350px,calc(100vw - 24px));max-height:min(86vh,560px);overflow:auto;
 border:4px solid #f6f0d6;outline:4px solid #81644b;border-radius:0;
 padding:16px 16px 14px;background:#ded29d;
 box-shadow:0 5px 0 #baae77,0 10px 0 #81644b;
 text-align:center;
}
.menu-card h1,.menu-card h2 {
 font-family:"Arial Black","Trebuchet MS",sans-serif;
 letter-spacing:-1px;line-height:.9;margin:0;
 -webkit-text-stroke:0 transparent;
}
.menu-card h1 {
 font-size:clamp(36px,7vw,56px);
 color:#69c63f;
 margin-bottom:10px;
 text-shadow:
  -3px -3px 0 #fff, 0 -3px 0 #fff, 3px -3px 0 #fff,
  -3px 0 0 #fff, 3px 0 0 #fff,
  -3px 3px 0 #fff, 0 3px 0 #fff, 3px 3px 0 #fff,
  4px 4px 0 #30963a, 7px 7px 0 #5d4750;
}
.menu-card h2 {
 font-size:clamp(28px,6vw,44px);
 color:#f29b3a;
 margin:0 0 12px;
 text-shadow:
  -3px -3px 0 #fff, 0 -3px 0 #fff, 3px -3px 0 #fff,
  -3px 0 0 #fff, 3px 0 0 #fff,
  -3px 3px 0 #fff, 0 3px 0 #fff, 3px 3px 0 #fff,
  4px 4px 0 #c66f2f, 7px 7px 0 #5d4750;
}
.menu-card p,.menu-card label,.menu-card .tiny-copy {font-size:11px;line-height:1.45;color:#7b5a3f}
.menu-card .subtitle {margin:0 0 12px; font-size:11px; letter-spacing:.4px; text-transform:uppercase; color:#87684b;}
.menu-actions {display:grid;gap:9px;margin-top:10px}
.menu-actions button,.menu-card button {
 position:static;min-height:38px;font:bold 15px "Arial Black","Trebuchet MS",sans-serif;
 letter-spacing:.4px;text-transform:uppercase;
 background:#7ac943;color:#fff;border:3px solid #f6f0da;border-radius:0;
 box-shadow:inset 0 -4px 0 #4ea034,0 4px 0 #654e3c;
 text-shadow:0 2px 0 #3a7b2a;cursor:pointer;
}
.menu-actions button:hover,.menu-card button:hover,.menu-actions button:focus-visible,.menu-card button:focus-visible {background:#8cd755;filter:none}
#settings-panel .setting-row {display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0;text-align:left;font-size:11px}
#settings-panel select {max-width:64%;padding:7px;background:#f7efcb;color:#654e3c;border:3px solid #b89d6a;border-radius:0;font:bold 11px "Arial Black","Trebuchet MS",sans-serif}
#settings-panel input {accent-color:#76c442}
#stats-text {text-align:left;line-height:1.7;font-size:11px}
#achievements-list {display:grid;gap:7px;text-align:left;margin:12px 0;font-size:11px}
#menu-hint {color:#8a6749!important;font-size:10px!important;margin:14px 0 0}
/* Keep countdown clear of the existing GET READY / TAP sprite (world y=100..270). */
#countdown {position:absolute;left:50%;top:8%;transform:translateX(-50%);pointer-events:none;z-index:5;
 background:#f2e7b5;color:#6abf36;border:3px solid #fffbea;outline:3px solid #543c46;
 box-shadow:3px 5px 0 #543c46;padding:5px 14px;
 text-shadow:2px 2px #fff,3px 3px #638a3d;
 font:bold 24px "Courier New",monospace;white-space:nowrap}
#menu-button {position:absolute;right:12px;bottom:52px;z-index:3}
#display-settings,#performance-settings {z-index:3}
@media(max-width:520px){#menu-button{right:6px;bottom:45px}.menu-card{padding:13px}.menu-actions{gap:7px}}

/* Touch layout: uncluttered playfield; Settings remains available through Menu. */
body.mobile-device #display-settings,
body.mobile-device #performance-settings,
body.mobile-device #fullscreen { display:none !important; }
body.mobile-device #menu-button {
 right:max(10px,env(safe-area-inset-right));
 bottom:calc(10px + env(safe-area-inset-bottom));
 padding:9px 12px;min-height:40px; z-index:6;
 border-radius:0;font:bold 13px "Trebuchet MS",sans-serif;
 background:#76c442;border:3px solid #f6f0da;
 box-shadow:inset 0 -3px #4ea034,0 3px #654e3c;
 text-shadow:0 1px #3a7b2a;
 touch-action:manipulation;
}
body.mobile-device .menu-card {
 width:min(355px,calc(100vw - 32px));
 max-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 32px);
 overflow-y:auto;
 -webkit-overflow-scrolling:touch;
}
body.mobile-device .menu-actions button,
body.mobile-device .menu-card button { min-height:44px;touch-action:manipulation; }
body.mobile-device .setting-row select { min-height:40px;font-size:14px; }
body.mobile-device #metrics { left:max(8px,env(safe-area-inset-left)); top:calc(8px + env(safe-area-inset-top)); }
@media (orientation:landscape) and (max-height:460px) {
 body.mobile-device .menu-card { padding:10px 14px; }
 body.mobile-device .menu-card h2 { font-size:24px; }
}
</style>
<canvas aria-label="Flappy Bird. Press Space, Up arrow, or click to flap."></canvas>
<div id="display-settings">
  <label for="display-mode">Display</label>
  <select id="display-mode" aria-label="Display mode">
    <option value="portrait">Original Portrait (9:16)</option>
    <option value="expanded">Expanded Fullscreen</option>
    <option value="ultrawide">Ultrawide (21:9)</option>
  </select>
</div>
<button id="fullscreen" type="button">Fullscreen (F)</button>
<div id="performance-settings"><label for="frame-limit">Render</label><select id="frame-limit"><option value="auto">Display Hz</option><option value="30">30 FPS</option><option value="60">60 FPS</option><option value="120">120 FPS</option><option value="144">144 FPS</option><option value="240">240 FPS</option></select><label><input type="checkbox" id="low-power"> Low power</label><button id="pause-button" type="button">Pause (P)</button></div>
<div id="metrics" hidden aria-live="off"></div>
<div id="pause-badge" hidden>PAUSED<small>Press P or Esc to resume</small></div>

<button id="menu-button" type="button">Menu (Esc)</button>
<div id="countdown" hidden></div>
<div id="game-menu" hidden><div class="menu-card">
 <div class="menu-actions"><button id="menu-settings">Settings</button><button id="menu-stats">Stats & Achievements</button><button id="menu-resume">Back to Game</button></div>
 </div></div>
<div id="settings-panel" hidden><div class="menu-card"><h2>Settings</h2>
 <div class="setting-row"><label for="menu-display">Display mode</label><select id="menu-display"><option value="portrait">Original Portrait</option><option value="expanded">Expanded Fullscreen</option><option value="ultrawide">Ultrawide 21:9</option></select></div>
 <div class="setting-row"><label for="menu-render">Render limit</label><select id="menu-render"><option value="auto">Display Hz</option><option value="30">30 FPS</option><option value="60">60 FPS</option><option value="120">120 FPS</option><option value="144">144 FPS</option><option value="240">240 FPS</option></select></div>
 <div class="setting-row"><label for="menu-low-power">Low power</label><input type="checkbox" id="menu-low-power"></div>
 <p>All settings are saved locally. Physics remains at its original rate.</p>
 <button class="back-menu">Back</button></div></div>

const gameMenu = document.querySelector("#game-menu");
const settingsPanel = document.querySelector("#settings-panel");
const statsPanel = document.querySelector("#stats-panel");
const countdownEl = document.querySelector("#countdown");
const menuButton = document.querySelector("#menu-button");
const menuDisplay = document.querySelector("#menu-display");
const menuRender = document.querySelector("#menu-render");
const menuLowPower = document.querySelector("#menu-low-power");
let menuOpen = false, countdownUntil = 0, countdownPending = false, hasPlayed = false;
let openingScrollPerTick = 0, openingTickCount = 0;
const initialStats = {games:0, pipes:0, timeSeconds:0, highest:0, totalScore:0, achievements:[]};
let stats = {...initialStats};
try {
  const loaded = JSON.parse(localStorage.getItem("flappy-player-stats") || "null");
  if (loaded && typeof loaded === "object") stats = {...initialStats,...loaded, achievements:Array.isArray(loaded.achievements)?loaded.achievements:[]};
} catch {}
function saveStats() {try{localStorage.setItem("flappy-player-stats",JSON.stringify(stats));}catch{}}
const achievementRules = [
 ["first-flight","First Flight",s=>s.games>=1],
 ["first-pipe","First Pipe",s=>s.pipes>=1],
 ["ten-pipes","Getting Started",s=>s.pipes>=10],
 ["fifty-pipes","Frequent Flyer",s=>s.pipes>=50],
 ["score-10","Double Digits",s=>s.highest>=10],
 ["score-25","Sky Pilot",s=>s.highest>=25],
 ["score-50","Unstoppable",s=>s.highest>=50]
];
function evaluateAchievements() {for(const [id,,test] of achievementRules)if(test(stats)&&!stats.achievements.includes(id))stats.achievements.push(id);saveStats();}
function updateStatsView(){
 const average=stats.games?(stats.totalScore/stats.games).toFixed(1):"0";
 document.querySelector("#stats-text").textContent=`Games: ${stats.games} · Best: ${Math.max(stats.highest,best)} · Average: ${average}
Total pipes: ${stats.pipes} · Play time: ${Math.floor(stats.timeSeconds/60)} min`;
 document.querySelector("#stats-text").style.whiteSpace="pre-line";
 document.querySelector("#achievements-list").replaceChildren(...achievementRules.map(([id,title])=>{const el=document.createElement("div");el.textContent=(stats.achievements.includes(id)?"✓ ":"○ ")+title;return el;}));
}
function syncMenuSettings(){menuDisplay.value=displayMode;menuRender.value=frameLimit;menuLowPower.checked=lowPower;}
function openMenu(panel="main") {
 menuOpen=true; countdownPending=false; countdownEl.hidden=true;
 gameMenu.hidden=panel!=="main";settingsPanel.hidden=panel!=="settings";statsPanel.hidden=panel!=="stats";
 if(panel==="settings")syncMenuSettings();
 if(panel==="stats")updateStatsView();
 menuButton.hidden=true;
}
function closeMenu(){menuOpen=false;gameMenu.hidden=settingsPanel.hidden=statsPanel.hidden=true;menuButton.hidden=false;document.activeElement?.blur?.();}
function beginRun(){
  paused=false;setPause(false);reset();hasPlayed=true;
  // Pre-roll a whole pipe lane during the countdown so widescreen starts look alive.
  // The lead pipe finishes near the middle-right of the playfield so GET READY stays clear.
  const targetX = Math.min(width - 140, Math.max(birdX + 220, width * 0.42));
  const introTicks = 90; // three seconds at the existing 30 Hz physics rate
  const spawnX = Math.max(width + pipeWidth + 4, targetX + speed * introTicks);
  openingScrollPerTick = (spawnX - targetX) / introTicks;
  openingTickCount = 0;
  for (let x = spawnX; x <= spawnX + width + spacing * 2; x += spacing) addPipe(x);
  closeMenu();countdownPending=true;countdownUntil=performance.now()+3000;
  countdownEl.hidden=true;
}
function resumeRun(){closeMenu();setPause(false);}
document.querySelector("#menu-resume").addEventListener("click",resumeRun);
document.querySelector("#menu-settings").addEventListener("click",()=>openMenu("settings"));
document.querySelector("#menu-stats").addEventListener("click",()=>openMenu("stats"));
document.querySelectorAll(".back-menu").forEach(b=>b.addEventListener("click",()=>openMenu()));
menuButton.addEventListener("click",()=>{setPause(true);openMenu();});

const canvas = document.querySelector("canvas");
const ctx = canvas.getContext("2d", { alpha: false });
const fullscreen = document.querySelector("#fullscreen");
const frameLimitPicker = document.querySelector("#frame-limit");
const lowPowerPicker = document.querySelector("#low-power");
const pauseButton = document.querySelector("#pause-button");
const metrics = document.querySelector("#metrics");
const pauseBadge = document.querySelector("#pause-badge");
let showMetrics = false, paused = false, frameLimit = "auto", lowPower = false;
try { frameLimit = localStorage.getItem("flappy-render-limit") || "auto"; lowPower = localStorage.getItem("flappy-low-power") === "true"; } catch {}
if (!["auto","30","60","120","144","240"].includes(frameLimit)) frameLimit = "auto";
frameLimitPicker.value = frameLimit; lowPowerPicker.checked = lowPower;
const frameHistory = new Float64Array(360);
let frameHistoryCount = 0, frameHistoryNext = 0;
let ticksObserved = 0, lastMetricsTime = 0, measuredPhysicsHz = 0;
let lastDisplayWidth = 0, lastDisplayHeight = 0;
const isMobileDevice = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||

const displayModePicker = document.querySelector("#display-mode");
const displayModes = ["portrait", "expanded", "ultrawide"];
let displayMode = isMobileDevice ? "portrait" : "expanded";
try {

  const key = isMobileDevice ? "flappy-bird-mobile-display-mode" : "flappy-bird-display-mode";
  const savedMode = localStorage.getItem(key);

let viewOffsetX = 0, viewOffsetY = 0, viewPixelWidth = 0, viewPixelHeight = 0;
const height = 512;
const floor = 400;
const gap = 100;
const pipeWidth = 52;
const speed = 4;
const spacing = 144;
const stepMs = 1000 / 30;
const art = {};
// Decoded once; each flap plays a lightweight Web Audio buffer source.
const audioBuffers = new Map();
let audioContext = null;
let audioDecoding = null;
const AudioContextType = window.AudioContext || window.webkitAudioContext;

function decodeEmbeddedSound(data) {
  const binary = atob(data);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

function prepareGameAudio() {
  if (audioDecoding || !AudioContextType) return audioDecoding;
  try {
    audioContext = new AudioContextType();
    const supportsOgg = !!document.createElement("audio").canPlayType('audio/ogg; codecs="vorbis"');
    const extension = supportsOgg ? ".ogg" : ".m4a";
    const entries = Object.entries(assets).filter(([name]) => name.endsWith(extension));
    audioDecoding = Promise.allSettled(entries.map(async ([name, data]) => {
      const key = name.replace("sounds/sfx_", "").replace(/\.(ogg|m4a)$/, "").replace("swooshing", "swoosh");
      const buffer = await audioContext.decodeAudioData(decodeEmbeddedSound(data));
      audioBuffers.set(key, buffer);
    }));
  } catch (error) {
    console.warn("Web Audio could not initialize:", error);
  }
  return audioDecoding;
}

// iOS Safari requires resume() to be called during a real user gesture.
function unlockGameAudio() {
  if (!audioContext) return;

  }
}

const birdFrames = ["up", "mid", "down", "mid"];
const birdFrameArt = {};
const backgroundPatterns = {};
const onAudioError = () => {};
let width, birdX, renderScale;
let pipes, y, velocity, angle, score, best, groundOffset, state, age, flapFrame;
let scenery, color, pipeArt, spin, flash, newBest;
let ready = false;
// Previous fixed-step positions are used only for smooth high-refresh rendering.
let previousY = 236, previousAngle = 0, previousGroundOffset = 0;
try { best = Math.max(0, Number(localStorage.getItem("flappy-bird-best")) || 0); }
catch { best = 0; }

const select = items => items[Math.floor(Math.random() * items.length)];

function resize() {
  const previousX = birdX;
  const viewportWidth = Math.max(1, canvas.clientWidth);
  const viewportHeight = Math.max(1, canvas.clientHeight);
  // In low-power mode cap the backing surface; never change world coordinates.
  const deviceRatio = window.devicePixelRatio || 1;
  const pixelRatio = isMobileDevice || lowPower ? Math.min(deviceRatio, 1.5) : deviceRatio;
  lastDisplayWidth = viewportWidth; lastDisplayHeight = viewportHeight;
  const backingWidth = Math.round(viewportWidth * pixelRatio);
  const backingHeight = Math.round(viewportHeight * pixelRatio);
  // Assigning the same canvas dimensions clears and reallocates its buffer.
  if (canvas.width !== backingWidth) canvas.width = backingWidth;
  if (canvas.height !== backingHeight) canvas.height = backingHeight;
  // All modes use one uniform scale; only the visible world width changes.
  // Portrait: native 288 x 512 field; Expanded: fit height, fill screen width;
  // Ultrawide: a 21:9 virtual field fitted inside the actual screen.
  if (displayMode === "portrait") {
    width = 288;
    renderScale = Math.min(canvas.width / width, canvas.height / height);
  } else if (displayMode === "ultrawide") {
    width = height * 21 / 9;
    renderScale = Math.min(canvas.width / width, canvas.height / height);
  } else {
    renderScale = canvas.height / height;
    width = canvas.width / renderScale;
  }
  viewPixelWidth = width * renderScale;
  viewPixelHeight = height * renderScale;
  viewOffsetX = (canvas.width - viewPixelWidth) / 2;
  viewOffsetY = (canvas.height - viewPixelHeight) / 2;
  birdX = Math.round(width * 0.22);
  if (pipes && Number.isFinite(previousX)) {
    for (const pipe of pipes) {
      pipe.x += birdX - previousX;
      if (pipe.previousX !== undefined) pipe.previousX += birdX - previousX;
    }
  }
}

function reset() {
  state = "ready";
  age = 0;
  y = 236;
  velocity = 0;
  angle = 0;
  score = 0;
  pipes = [];
  groundOffset = 0;
  flapFrame = 0;
  spin = 0;
  flash = 0;
  newBest = false;
  scenery = select(["background-day.png", "background-night.png"]);
  color = select(["yellow", "red", "blue"]);
  pipeArt = select(["pipe-green.png", "pipe-red.png"]);
  previousY = y;
  previousAngle = angle;
  previousGroundOffset = groundOffset;
}

function play(name) {
  if (!audioContext || audioContext.state !== "running") return;
  const buffer = audioBuffers.get(name);
  if (!buffer) return; // A first tap may arrive before decoding finishes.
  const source = audioContext.createBufferSource();
  source.buffer = buffer;
  source.connect(audioContext.destination);
  source.start(0);
}

function addPipe(x) {
  const top = 80 + Math.floor(Math.random() * 160);
  pipes.push({ x, previousX: x, top, scored: false });
}

function act() {
  if (!ready || paused || menuOpen || countdownPending) return;
  if (state === "results") {
    if (age >= 9) beginRun();
    return;
  }
  if (state === "ready") {
    state = "playing";
    hasPlayed = true;
    stats.games++;evaluateAchievements();
    age = 0;
    // If started directly from the canvas, use an offscreen spawn. Menu play
    // pre-rolls the same pipe sequence during its visual countdown instead.
    if (!pipes.length) for (let x = width + 1; x <= width + 1 + spacing; x += spacing) addPipe(x);
  }
  if (state === "playing") {
    velocity = -9;
    angle = -25;
    play("wing");
  }
}

function crash(landed) {
  if (state !== "playing") return;
  state = "crashing";
  age = 0;
  flash = 4;
  velocity = Math.max(0, velocity);
  play("hit");
  if (!landed) play("die");
}

function results() {
  state = "results";
  age = 0;
  newBest = score > best;
  stats.highest=Math.max(stats.highest,score);stats.totalScore+=score;evaluateAchievements();
  if (newBest) {
    best = score;
    try { localStorage.setItem("flappy-bird-best", String(best)); }
    catch {}
  }
  play("swoosh");
}

function tick() {
  ticksObserved++;
  if(menuOpen)return;
  if(countdownPending){
    previousY=y;previousAngle=angle;previousGroundOffset=groundOffset;
    for(const pipe of pipes){pipe.previousX=pipe.x;pipe.x-=openingScrollPerTick;}
    openingTickCount++;
    groundOffset=(groundOffset+speed)%336;
    spin+=.16;y=236+8*Math.sin(spin);
    if(openingTickCount%3===0)flapFrame=(flapFrame+1)%4;
    return;
  }
  if(state==="playing") {stats.timeSeconds+=1/30;if(Math.floor(stats.timeSeconds*30)%300===0)saveStats();}
  previousY = y;
  previousAngle = angle;
  previousGroundOffset = groundOffset;
  for (const pipe of pipes) pipe.previousX = pipe.x;
  age++;
  if (flash > 0) flash--;
  if (state === "ready" || state === "playing") {
    groundOffset = (groundOffset + speed) % 336;
    if (age % 3 === 0) flapFrame = (flapFrame + 1) % 4;
  }
  if (state === "ready") {
    spin += 0.16;
    y = 236 + 8 * Math.sin(spin);
  }
  if (state === "playing") {
    y += velocity;
    velocity = Math.min(velocity + 1, 10);
    angle = Math.min(angle + 3, 90);
    for (const pipe of pipes) pipe.x -= speed;
    while (pipes[0]?.x + pipeWidth < 0) pipes.shift();
    if (pipes.length === 0) addPipe(width);
    while (pipes.at(-1).x < width) addPipe(pipes.at(-1).x + spacing);
    if (y > floor - 10) {
      y = floor - 10;
      crash(true);
      return;
    }
    if (y < 10) {
      y = 10;
      velocity = Math.max(0, velocity);
    }
    for (const pipe of pipes) {
      const across = birdX + 13 > pipe.x && birdX - 13 < pipe.x + pipeWidth;
      if (across && (y - 9 < pipe.top || y + 9 > pipe.top + gap)) {
        crash(false);
        return;
      }
      if (!pipe.scored && birdX >= pipe.x + pipeWidth / 2) {
        pipe.scored = true;
        score++;
        stats.pipes++; stats.highest=Math.max(stats.highest,score);evaluateAchievements();
        play("point");
      }
    }
  } else if (state === "crashing") {
    y = Math.min(floor - 10, y + velocity);
    velocity = Math.min(velocity + 1.4, 14);
    angle = Math.min(angle + 12, 90);
    if (y >= floor - 10 && age >= 12) results();
  }
}

function draw(name, x, y) {
  ctx.drawImage(art[name], Math.round(x), Math.round(y));
}

function drawPipe(pipe, alpha) {
  const interpolatedX = pipe.previousX + (pipe.x - pipe.previousX) * alpha;
  if (isMobileDevice) {
    // On high-density Safari canvases, rounding to whole world pixels makes
    // the pipe jump in uneven *screen* pixel increments. Snap to the actual
    // canvas backing-pixel grid instead, without changing physics/hitboxes.
    const x = (Math.round(viewOffsetX + interpolatedX * renderScale) - viewOffsetX) / renderScale;
    ctx.drawImage(art[pipeArt], x, pipe.top + gap);
    ctx.save();
    ctx.translate(x + pipeWidth, pipe.top);
    ctx.rotate(Math.PI);
    ctx.drawImage(art[pipeArt], 0, 0);
    ctx.restore();
  } else {
    // Preserve the existing desktop rendering exactly.
    const x = Math.round(interpolatedX);
    draw(pipeArt, x, pipe.top + gap);
    ctx.save();
    ctx.translate(x + pipeWidth, pipe.top);
    ctx.rotate(Math.PI);
    draw(pipeArt, 0, 0);
    ctx.restore();
  }
}

function drawBird(alpha) {
  ctx.save();
  ctx.translate(birdX, Math.round(previousY + (y - previousY) * alpha));
  ctx.rotate((previousAngle + (angle - previousAngle) * alpha) * Math.PI / 180);
  ctx.drawImage(birdFrameArt[color][flapFrame], -17, -12);
  ctx.restore();
}

function digits(value, x, y, size, anchor) {
  const number = String(value);
  const digitWidth = size === "big" ? 24 : 12;
  const rightOffset = anchor === "center" ? number.length * digitWidth / 2 : number.length * digitWidth;
  for (let i = 0; i < number.length; i++) {
    draw("font_" + size + "_" + number[i] + ".png", x - rightOffset + i * digitWidth, y);
  }
}

function drawResults() {
  const x = Math.round((width - 236) / 2);
  const slide = Math.max(0, 9 - age) * 19;
  const panelY = 70 + slide;
  draw("scoreboard.png", x, panelY);
  if (score >= 10) {
    const medal = score >= 40 ? "platinum" : score >= 30 ? "gold" : score >= 20 ? "silver" : "bronze";
    draw("medal_" + medal + ".png", x + 32, panelY + 114);
  }
  digits(score, x + 209, panelY + 105, "small", "right");
  digits(best, x + 209, panelY + 147, "small", "right");
  if (newBest) {
    ctx.font = "bold 9px monospace";
    ctx.fillStyle = "#ff7038";
    ctx.fillText("NEW", x + 143, panelY + 155);
  }
  draw("replay.png", (width - 115) / 2, panelY + 205);
}

function render(alpha) {
  // Bars and clipping are only necessary when the playfield is letterboxed.
  // Avoid a full-screen clear followed by another opaque background redraw.
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const letterboxed = viewOffsetX > 0.5 || viewOffsetY > 0.5;
  if (letterboxed) {
    ctx.fillStyle = "#202b30";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.beginPath();
    ctx.rect(viewOffsetX, viewOffsetY, viewPixelWidth, viewPixelHeight);
    ctx.clip();
  }
  ctx.setTransform(renderScale, 0, 0, renderScale, viewOffsetX, viewOffsetY);
  ctx.imageSmoothingEnabled = false;
  // Reuse the decoded background pattern instead of drawing many tiles per frame.
  // The translated pattern retains the original centering of the native tiles.
  const backgroundWidth = art[scenery].width;
  const startX = Math.floor((width % backgroundWidth - backgroundWidth) / 2);
  ctx.fillStyle = backgroundPatterns[scenery];
  ctx.save();
  ctx.translate(startX, 0);
  ctx.fillRect(-startX, 0, width, height);
  ctx.restore();
  for (const pipe of pipes) drawPipe(pipe, alpha);
  drawBird(alpha);
  // Unwrap the repeating ground coordinate before interpolating across its seam.
  const groundTravel = (groundOffset - previousGroundOffset + 336) % 336;
  const smoothGround = (previousGroundOffset + groundTravel * alpha) % 336;
  for (let x = -smoothGround; x < width; x += 336) draw("base.png", x, floor);
  if (state === "ready") draw("splash.png", (width - 188) / 2, 100);
  // Use the actual game sprite font for the countdown instead of an HTML overlay.
  // The count is placed above GET READY so neither the bird nor the TAP art is obscured.
  if (countdownPending) {
    const remaining = Math.max(1, Math.ceil((countdownUntil - performance.now()) / 1000));
    digits(remaining, width / 2, 36, "big", "center");
  }
  if (state === "playing") digits(score, width / 2, 24, "big", "center");
  if (state === "results") drawResults();
  if (flash > 0) {
    ctx.fillStyle = "rgba(255,255,255," + flash * 0.12 + ")";
    ctx.fillRect(0, 0, width, height);
  }
  if (letterboxed) ctx.restore();
}

function setPause(next) {

async function toggleFullscreen() {

    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch {
    fullscreen.textContent = "Press F11 for fullscreen";
  }
  fullscreen.blur();
}

fullscreen.addEventListener("click", toggleFullscreen);
document.addEventListener("fullscreenchange", () => {
  fullscreen.hidden = Boolean(document.fullscreenElement);

canvas.addEventListener("pointerdown", event => {
  if (event.button !== 0 || menuOpen || countdownPending) return;
  event.preventDefault();
  const px = event.offsetX / canvas.clientWidth * canvas.width;
  const py = event.offsetY / canvas.clientHeight * canvas.height;
  if (px < viewOffsetX || px > viewOffsetX + viewPixelWidth ||
      py < viewOffsetY || py > viewOffsetY + viewPixelHeight) return;
  if (state === "results") {
    const x = (px - viewOffsetX) / renderScale;
    const clickY = (py - viewOffsetY) / renderScale;
    if (Math.abs(x - width / 2) > 60 || clickY < 275 || clickY > 345) return;
  }
  act();
});
window.addEventListener("keydown", event => {
  if (event.repeat) return;
  const focusedControl = event.target instanceof HTMLElement && (event.target.matches("select,input,textarea") || event.target.closest("#settings-panel"));
  if(event.code==="Escape" && menuOpen){event.preventDefault();if(!gameMenu.hidden)resumeRun();else openMenu();return;}
  if(menuOpen){if(event.code==="Enter" && !focusedControl && document.activeElement?.click)document.activeElement.click();return;}
  // Space always flaps after a dropdown has been selected, instead of reopening it.
  if(event.code==="Space" && (event.target===displayModePicker || event.target===frameLimitPicker)){
    event.preventDefault();event.target.blur();act();return;
  }
  if(focusedControl)return;
  if(event.code==="Escape" && !paused){event.preventDefault();setPause(true);openMenu();return;}
  if (event.code === "F3") {
    event.preventDefault();
    showMetrics = !showMetrics;
    metrics.hidden = !showMetrics;
    return;
  }
  if (event.code === "KeyP" || event.code === "Escape") {
    event.preventDefault();
    setPause(!paused);
    return;
  }
  if (event.target === lowPowerPicker) return;
  if (event.code === "KeyF") toggleFullscreen();
  if (event.code === "KeyM") {
    changeDisplayMode(displayModes[(displayModes.indexOf(displayMode) + 1) % displayModes.length]);
  }
  if (event.code === "Space" || event.code === "ArrowUp" ||
      (event.code === "Enter" && state === "results")) {
    event.preventDefault();
    act();
  }
});

window.addEventListener("orientationchange", () => requestAnimationFrame(resize));

async function start() {
  prepareGameAudio();
  await Promise.all(Object.entries(assets).map(async ([name, data]) => {
    if (name.endsWith(".png")) {
      const sprite = new Image();
      sprite.src = "data:image/png;base64," + data;
      await sprite.decode();
      art[name] = sprite;
    }
  }));
  for (const birdColor of ["yellow", "red", "blue"]) {
    birdFrameArt[birdColor] = birdFrames.map(frame => art[birdColor + "bird-" + frame + "flap.png"]);
  }
  for (const background of ["background-day.png", "background-night.png"]) {
    backgroundPatterns[background] = ctx.createPattern(art[background], "repeat");
    if (!backgroundPatterns[background]) throw new Error("Could not prepare background pattern");
  }
  resize();
  reset();
  ready = true;
  closeMenu(); // Launch directly into the classic GET READY screen.
  let previous = performance.now();
  let elapsed = 0;
  let animationId = 0;
  let previousDraw = 0;
  lastMetricsTime = previous;
  function frame(now) {
    if (!isMobileDevice) pollGamepad();
    if(countdownPending){
      const remaining=Math.max(0,countdownUntil-now);
      if(remaining<=0){countdownPending=false;countdownEl.hidden=true;act();}
      else countdownEl.hidden=true;
    }
    const delta = Math.max(0, now - previous);
    previous = now;
    // Pausing freezes game physics; never accumulate catch-up time while paused.
    if (!paused && !menuOpen) {
      elapsed += Math.min(100, delta);
      while (elapsed >= stepMs) {
        tick();
        elapsed -= stepMs;
      }
    }
    if(menuOpen) elapsed=0;
    // requestAnimationFrame stays synchronized to display refresh on Auto.
    // Explicit caps skip drawing only; physics keeps its original cadence.
    // Auto uses a 60 FPS mobile target instead of unbounded ProMotion redraws.
    const requestedLimit = frameLimit === "auto" ? 0 : Number(frameLimit);
    const effectiveLimit = lowPower ? (requestedLimit ? Math.min(60, requestedLimit) : 60) : requestedLimit;
    const drawInterval = effectiveLimit ? 1000 / effectiveLimit : 0;
    if (!previousDraw || now - previousDraw >= drawInterval - 0.5) {
      if (previousDraw && !paused) {
        frameHistory[frameHistoryNext] = now - previousDraw;
        frameHistoryNext = (frameHistoryNext + 1) % frameHistory.length;
        frameHistoryCount = Math.min(frameHistoryCount + 1, frameHistory.length);
      }
      previousDraw = now;
      render(Math.min(1, elapsed / stepMs));
    }
    if (showMetrics && now - lastMetricsTime >= 750) {
      const samples = Array.from(frameHistory.slice(0, frameHistoryCount)).sort((a,b) => a-b);
      const mean = samples.length ? samples.reduce((a,b)=>a+b,0)/samples.length : 0;
      const lowIndex = Math.max(0, Math.ceil(samples.length * .99)-1);
      const lowFps = samples.length ? 1000/samples[lowIndex] : 0;
      const intervalSeconds = (now - lastMetricsTime)/1000;
      measuredPhysicsHz = ticksObserved / intervalSeconds;
      ticksObserved = 0;
      lastMetricsTime = now;
      metrics.textContent = `Render FPS: ${mean?(1000/mean).toFixed(1):"--"}\n1% low (sample): ${lowFps.toFixed(1)} FPS\nMean frame: ${mean.toFixed(2)} ms\nPhysics: ${measuredPhysicsHz.toFixed(1)} Hz\nCanvas: ${canvas.width} × ${canvas.height}\nMode: ${displayMode}\nRender cap: ${frameLimit === "auto" ? "Display" : frameLimit}\nLow power: ${lowPower ? "on" : "off"}\nPaused: ${paused ? "yes" : "no"}`;
    } else if (!showMetrics && now - lastMetricsTime >= 750) {
      lastMetricsTime = now;
      ticksObserved = 0;
    }
    animationId = requestAnimationFrame(frame);
  }
  // Hidden tabs cannot be played meaningfully. Stop rendering and discard
  // elapsed background time so a returning player does not get a physics jump.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      cancelAnimationFrame(animationId);
      animationId = 0;
    } else if (!animationId) {
      previous = performance.now();
      previousDraw = 0;
      elapsed = 0;
      frameHistoryCount = frameHistoryNext = 0;
      lastMetricsTime = previous;
      ticksObserved = 0;
      previousY = y;
      previousAngle = angle;
      previousGroundOffset = groundOffset;
      for (const pipe of pipes) pipe.previousX = pipe.x;
      animationId = requestAnimationFrame(frame);
    }
  });
  if (!document.hidden) animationId = requestAnimationFrame(frame);
}

start().catch(error => {
  console.error(error);
  const status = document.createElement("p");
  status.textContent = "Flappy Bird could not load its game assets.";
  status.style.cssText = "position:absolute;top:1rem;left:1rem;color:white";
  document.body.append(status);
});
</script>
